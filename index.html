<!DOCTYPE html>
<!--
  Pacing — a homework agenda built from your class pacing guides.
  Single self-contained file: paste this whole thing into any static
  page/host (its own .html file, GitHub Pages, Netlify, a "custom code"
  block, etc.) and it works with no build step and no server.

  Data lives in the browser's localStorage, per-browser. If you want it
  on your phone too, use the Export/Import buttons on the Classes tab
  to move a backup file between devices.

  One optional dependency: Google Fonts (IBM Plex). If that CDN is
  blocked on wherever you host this, it falls back to system fonts
  automatically — nothing breaks.
-->
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pacing</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #EEF1EF;
    --surface: #FFFFFF;
    --surface-2: #F6F8F7;
    --ink: #1C2321;
    --ink-soft: #5B6663;
    --ink-faint: #8B9491;
    --line: #DCE1DE;
    --line-strong: #C3CAC6;
    --accent: #2F5D4E;
    --accent-ink: #1F4438;
    --accent-soft: #E1EBE6;
    --highlight: #A8650E;
    --highlight-soft: #F6E6CC;
    --danger: #A3403A;
    --danger-soft: #F5E1DF;
    --radius: 6px;
    --shadow-modal: 0 16px 44px rgba(20, 30, 26, 0.20);
    --font-sans: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    --font-mono: 'IBM Plex Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-sans);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  button, input, textarea { font-family: inherit; font-size: inherit; color: inherit; }
  h1, h2, h3, p { margin: 0; }

  .app { max-width: 860px; margin: 0 auto; padding: 0 24px 72px; min-height: 100vh; }

  .topbar {
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px;
    padding: 28px 0 20px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 28px;
  }
  .brand { font-weight: 600; font-size: 19px; letter-spacing: -0.01em; }

  .tabs { display: flex; gap: 4px; background: var(--surface-2); padding: 3px; border-radius: 8px; }
  .tab {
    border: none; background: transparent; padding: 7px 16px; border-radius: 6px;
    font-size: 14px; font-weight: 500; color: var(--ink-soft); cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .tab.active { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(20,30,26,0.10); }
  .tab:hover:not(.active) { color: var(--ink); }

  button:focus-visible, input:focus-visible, textarea:focus-visible, .day-card:focus-visible, .class-card:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }

  .view { display: none; }
  .view.active { display: block; }

  /* ---- Date strip ---- */
  .date-strip { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; }
  .icon-btn {
    width: 34px; height: 34px; border: 1px solid var(--line); background: var(--surface);
    border-radius: var(--radius); font-size: 18px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; color: var(--ink-soft);
    flex-shrink: 0;
  }
  .icon-btn:hover { border-color: var(--line-strong); color: var(--ink); }

  .date-display { flex: 1; display: flex; align-items: baseline; gap: 12px; min-width: 0; flex-wrap: wrap; }
  .weekday { font-size: 16px; color: var(--ink-soft); }
  .datenum { font-family: var(--font-mono); font-size: 34px; font-weight: 500; letter-spacing: -0.01em; }

  .btn-ghost {
    border: 1px solid var(--line); background: var(--surface); padding: 7px 14px; border-radius: var(--radius);
    font-size: 13.5px; font-weight: 500; cursor: pointer; color: var(--ink-soft); white-space: nowrap;
  }
  .btn-ghost:hover { border-color: var(--line-strong); color: var(--ink); }

  .btn-primary {
    border: 1px solid var(--accent); background: var(--accent); color: #fff; padding: 8px 16px;
    border-radius: var(--radius); font-size: 13.5px; font-weight: 500; cursor: pointer; white-space: nowrap;
  }
  .btn-primary:hover { background: var(--accent-ink); border-color: var(--accent-ink); }

  .btn-danger {
    border: 1px solid var(--danger); background: transparent; color: var(--danger); padding: 7px 14px;
    border-radius: var(--radius); font-size: 13.5px; font-weight: 500; cursor: pointer;
  }
  .btn-danger:hover { background: var(--danger-soft); }

  /* ---- Agenda ---- */
  .agenda-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 40px; }

  .day-card {
    display: block; width: 100%; text-align: left; font: inherit; color: inherit;
    background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--class-color, var(--accent));
    border-radius: var(--radius); padding: 14px 18px; cursor: pointer;
    transition: border-color 0.15s ease;
  }
  .day-card:hover { border-color: var(--line-strong); }
  .day-card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 6px; }
  .day-card-head-left { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-width: 0; }
  .day-card-class { font-weight: 600; font-size: 14.5px; }
  .edit-hint { opacity: 0; font-size: 12px; color: var(--ink-faint); transition: opacity 0.15s ease; flex-shrink: 0; }
  .day-card:hover .edit-hint { opacity: 1; }
  .badge-note {
    background: var(--highlight-soft); color: var(--highlight); font-size: 12px; font-weight: 500;
    padding: 3px 9px; border-radius: 100px; white-space: nowrap;
  }
  .day-card-topic { color: var(--ink-soft); font-size: 14px; margin-bottom: 4px; }
  .day-card-hw { font-size: 14.5px; }
  .day-card-hw .label { color: var(--ink-faint); margin-right: 6px; }
  .day-card-empty { color: var(--ink-faint); font-size: 14px; }

  .section-heading { font-size: 14px; font-weight: 600; color: var(--ink-soft); margin: 0 0 14px; }

  .upcoming-list { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
  .upcoming-row {
    display: grid; grid-template-columns: 84px 1fr; gap: 16px; padding: 12px 0;
    border-bottom: 1px solid var(--line); font-size: 14px;
  }
  .upcoming-date { font-family: var(--font-mono); color: var(--ink-soft); font-size: 13px; padding-top: 1px; }
  .upcoming-items { display: flex; flex-direction: column; gap: 6px; }
  .upcoming-item { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .upcoming-item .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .upcoming-item .cls { color: var(--ink-soft); font-size: 13px; }

  .empty-state { padding: 28px 0; color: var(--ink-faint); }
  .empty-state.bordered { border-top: 1px solid var(--line); padding-top: 20px; }
  button.link { color: var(--accent); background: none; border: none; padding: 0; cursor: pointer; text-decoration: underline; font-size: inherit; }

  /* ---- Classes ---- */
  .classes-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
  .page-title { font-size: 20px; font-weight: 600; }
  .classes-actions { display: flex; gap: 8px; flex-wrap: wrap; }

  .class-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; }
  .class-card {
    background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--class-color, var(--accent));
    border-radius: var(--radius); padding: 16px; cursor: pointer; text-align: left; font: inherit; color: inherit;
  }
  .class-card:hover { border-color: var(--line-strong); }
  .class-card-name { font-weight: 600; font-size: 15px; margin-bottom: 4px; word-break: break-word; }
  .class-card-meta { font-size: 12.5px; color: var(--ink-faint); }
  .add-class-card {
    border: 1px dashed var(--line-strong); background: transparent; border-radius: var(--radius);
    display: flex; align-items: center; justify-content: center; color: var(--ink-soft);
    font-size: 14px; font-weight: 500; cursor: pointer; min-height: 74px;
  }
  .add-class-card:hover { border-color: var(--accent); color: var(--accent); }

  /* ---- Modal ---- */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(20, 30, 26, 0.35);
    display: flex; align-items: flex-start; justify-content: center;
    padding: 40px 16px; overflow-y: auto; z-index: 100;
  }
  .modal-overlay[hidden] { display: none; }
  .modal {
    background: var(--surface); border-radius: 10px; box-shadow: var(--shadow-modal);
    width: 100%; max-width: 720px; padding: 22px 26px 26px;
  }
  .modal-small { max-width: 400px; }

  .modal-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 4px; }
  .modal-title-row { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
  .class-name-input {
    font-size: 18px; font-weight: 600; border: 1px solid transparent; background: transparent;
    padding: 4px 6px; border-radius: 5px; width: 100%; min-width: 0;
  }
  .class-name-input:hover, .class-name-input:focus { border-color: var(--line); background: var(--surface-2); }

  .color-swatch {
    width: 22px; height: 22px; border-radius: 50%; border: none; cursor: pointer; flex-shrink: 0;
    background: var(--class-color); box-shadow: 0 0 0 1px var(--line-strong);
  }
  .color-picker { display: flex; gap: 8px; flex-wrap: wrap; padding: 10px 0 6px 32px; }
  .color-picker[hidden] { display: none; }
  .color-picker .dot { width: 22px; height: 22px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; padding: 0; }
  .color-picker .dot.selected { border-color: var(--ink); }

  .close-x { background: none; border: none; font-size: 20px; color: var(--ink-faint); cursor: pointer; padding: 2px 4px; line-height: 1; }
  .close-x:hover { color: var(--ink); }

  .field-label { font-size: 13px; font-weight: 500; color: var(--ink-soft); margin: 16px 0 6px; }
  .field-hint { font-size: 12px; color: var(--ink-faint); margin: 8px 0 0; }

  textarea.paste-box {
    width: 100%; min-height: 96px; border: 1px solid var(--line); border-radius: var(--radius);
    padding: 10px 12px; font-family: var(--font-mono); font-size: 12.5px; line-height: 1.55; resize: vertical;
  }
  textarea.paste-box:focus { border-color: var(--accent); outline: none; }

  .parse-row { display: flex; justify-content: flex-end; margin-top: 8px; }

  .entries-block { margin-top: 20px; border-top: 1px solid var(--line); padding-top: 16px; }
  .entries-head { margin-bottom: 10px; }
  .entries-head h3 { font-size: 14px; font-weight: 600; }

  .entries-table-wrap { max-height: 320px; overflow-y: auto; border: 1px solid var(--line); border-radius: var(--radius); }
  .entries-table-head, .entry-row {
    display: grid; grid-template-columns: 136px 1fr 1fr 120px 28px; gap: 8px; align-items: center;
  }
  .entries-table-head {
    padding: 8px 8px; font-size: 11.5px; font-weight: 600; color: var(--ink-faint);
    border-bottom: 1px solid var(--line); background: var(--surface-2); position: sticky; top: 0;
  }
  .entry-row { padding: 6px 8px; border-bottom: 1px solid var(--line); }
  .entry-row:last-of-type { border-bottom: none; }
  .entry-row.new-row { animation: highlightRow 1.6s ease; }
  @keyframes highlightRow { 0% { background: var(--accent-soft); } 100% { background: transparent; } }
  .entry-row input {
    border: 1px solid transparent; background: transparent; padding: 5px 6px; border-radius: 4px;
    font-size: 13px; width: 100%; min-width: 0;
  }
  .entry-row input:hover { background: var(--surface-2); }
  .entry-row input:focus { background: var(--surface); border-color: var(--accent); outline: none; }
  .entry-row input[type="date"] { font-family: var(--font-mono); font-size: 12px; padding: 5px 2px; }
  .entry-row .row-delete { background: none; border: none; color: var(--ink-faint); cursor: pointer; font-size: 15px; padding: 4px; }
  .entry-row .row-delete:hover { color: var(--danger); }

  .add-entry-row { padding: 10px 8px; }
  .add-entry-row button { font-size: 13px; color: var(--accent); background: none; border: none; cursor: pointer; font-weight: 500; padding: 4px 0; }
  .add-entry-row button:hover { text-decoration: underline; }

  .modal-footer { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 22px; padding-top: 16px; border-top: 1px solid var(--line); }

  .confirm-text { font-size: 14.5px; margin-bottom: 20px; }
  .confirm-actions { display: flex; justify-content: flex-end; gap: 10px; }

  @media (max-width: 640px) {
    .app { padding: 0 16px 56px; }
    .topbar { padding: 20px 0 16px; }
    .datenum { font-size: 26px; }
    .entries-table-head { display: none; }
    .entry-row { grid-template-columns: 1fr; gap: 4px; padding: 10px 34px 10px 8px; position: relative; }
    .entry-row .row-delete { position: absolute; top: 6px; right: 4px; }
    .entry-row input { border: 1px solid var(--line); margin-bottom: 2px; }
    .entry-row input[type="date"] { max-width: 160px; }
    .color-picker { padding-left: 0; }
  }

  /* ---- Login ---- */
  .auth-screen {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 24px; background: var(--paper);
  }
  .auth-card {
    width: 100%; max-width: 420px; background: var(--surface);
    border: 1px solid var(--line); border-radius: 10px; padding: 28px;
    box-shadow: var(--shadow-modal);
  }
  .auth-card h1 { font-size: 24px; margin-bottom: 6px; }
  .auth-subtitle { color: var(--ink-soft); margin-bottom: 22px; }
  .auth-label { display:block; font-size:13px; font-weight:500; color:var(--ink-soft); margin:14px 0 6px; }
  .auth-input {
    width:100%; border:1px solid var(--line); border-radius:var(--radius);
    padding:10px 12px; background:var(--surface); outline:none;
  }
  .auth-input:focus { border-color:var(--accent); }
  .auth-error { color:var(--danger); background:var(--danger-soft); padding:9px 11px; border-radius:var(--radius); margin:14px 0; font-size:13px; }
  .auth-success { color:var(--accent-ink); background:var(--accent-soft); padding:9px 11px; border-radius:var(--radius); margin:14px 0; font-size:13px; }
  .auth-actions { display:flex; gap:8px; margin-top:18px; }
  .auth-actions button { flex:1; }
  .auth-toggle { margin-top:16px; text-align:center; color:var(--ink-soft); font-size:13px; }
  .auth-toggle button { border:0; background:none; color:var(--accent); cursor:pointer; text-decoration:underline; }
  .account-area { display:flex; align-items:center; gap:8px; }
  .account-email { font-size:12px; color:var(--ink-soft); max-width:220px; overflow:hidden; text-overflow:ellipsis; }
  .hidden { display:none !important; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>
<div id="authScreen" class="auth-screen">
  <div class="auth-card">
    <h1>Pacing</h1>
    <p class="auth-subtitle">Your homework agenda, saved to your account.</p>
    <form id="authForm">
      <label class="auth-label" for="authEmail">Email</label>
      <input class="auth-input" id="authEmail" type="email" autocomplete="email" required placeholder="you@example.com">
      <label class="auth-label" for="authPassword">Password</label>
      <input class="auth-input" id="authPassword" type="password" autocomplete="current-password" required minlength="6" placeholder="At least 6 characters">
      <div id="authMessage" class="hidden"></div>
      <div class="auth-actions">
        <button class="btn-primary" id="authSubmit" type="submit">Log in</button>
      </div>
    </form>
    <div class="auth-toggle">
      <span id="authToggleText">Don't have an account?</span>
      <button type="button" id="authToggle">Create account</button>
    </div>
  </div>
</div>
<noscript><div style="padding:40px;text-align:center;color:#5B6663;">This tool needs JavaScript enabled to work.</div></noscript>

<div class="app hidden">
  <header class="topbar">
    <div class="brand">Pacing</div>
    <div class="account-area">
      <span id="accountEmail" class="account-email"></span>
      <button id="logoutBtn" class="btn-ghost">Log out</button>
    </div>
    <nav class="tabs" role="tablist">
      <button class="tab active" data-tab="agenda" role="tab" aria-selected="true">Agenda</button>
      <button class="tab" data-tab="classes" role="tab" aria-selected="false">Classes</button>
    </nav>
  </header>

  <main>
    <section id="view-agenda" class="view active">
      <div class="date-strip">
        <button id="prevDay" class="icon-btn" aria-label="Previous day">‹</button>
        <div class="date-display">
          <span class="weekday" id="weekdayLabel"></span>
          <span class="datenum" id="dateNumLabel"></span>
        </div>
        <button id="todayBtn" class="btn-ghost">Today</button>
        <button id="nextDay" class="icon-btn" aria-label="Next day">›</button>
      </div>

      <div id="agendaList" class="agenda-list"></div>

      <h2 class="section-heading">Upcoming</h2>
      <div id="upcomingList" class="upcoming-list"></div>
    </section>

    <section id="view-classes" class="view">
      <div class="classes-header">
        <h1 class="page-title">Your classes</h1>
        <div class="classes-actions">
          <button id="exportBtn" class="btn-ghost">Export</button>
          <button id="importBtn" class="btn-ghost">Import</button>
          <input type="file" id="importFile" accept="application/json" hidden />
          <button id="addClassBtn" class="btn-primary">Add class</button>
        </div>
      </div>
      <div id="classGrid" class="class-grid"></div>
    </section>
  </main>
</div>

<div id="modalOverlay" class="modal-overlay" hidden>
  <div class="modal" tabindex="-1"></div>
</div>

<div id="confirmOverlay" class="modal-overlay" hidden>
  <div class="modal modal-small" role="alertdialog" aria-modal="true"></div>
</div>

<script>
(function () {
  'use strict';

  /* ============ Account + cloud storage ============ */
  /*
    IMPORTANT:
    1. Create a Supabase project.
    2. Run pacing_supabase_setup.sql supplied with this file.
    3. Put your Project URL and Publishable/anon key below.
  */
  var SUPABASE_URL = 'PASTE_YOUR_SUPABASE_PROJECT_URL_HERE';
  var SUPABASE_PUBLISHABLE_KEY = 'PASTE_YOUR_SUPABASE_PUBLISHABLE_KEY_HERE';

  var supabaseClient = null;
  var state = null;
  var currentUser = null;
  var authMode = 'login';
  var memoryFallback = null;

  function configured() {
    return SUPABASE_URL.indexOf('PASTE_') !== 0 &&
           SUPABASE_PUBLISHABLE_KEY.indexOf('PASTE_') !== 0;
  }

  function showAuthMessage(message, kind) {
    var el = document.getElementById('authMessage');
    el.textContent = message;
    el.className = kind === 'success' ? 'auth-success' : 'auth-error';
  }

  function clearAuthMessage() {
    var el = document.getElementById('authMessage');
    el.textContent = '';
    el.className = 'hidden';
  }

  function showApp(user) {
    currentUser = user;
    document.getElementById('authScreen').classList.add('hidden');
    document.querySelector('.app').classList.remove('hidden');
    document.getElementById('accountEmail').textContent = user.email || '';
  }

  function showLogin() {
    currentUser = null;
    state = null;
    document.querySelector('.app').classList.add('hidden');
    document.getElementById('authScreen').classList.remove('hidden');
    document.getElementById('accountEmail').textContent = '';
  }

  function seedData() {
    var names = ['Math', 'Elective', 'English', 'Science', 'History', 'Language'];
    return {
      classes: names.map(function (name, i) {
        return { id: uid(), name: name, color: PALETTE[i % PALETTE.length], entries: [] };
      })
    };
  }

  async function loadData() {
    if (!supabaseClient || !currentUser) return null;
    var result = await supabaseClient
      .from('pacing_data')
      .select('data')
      .eq('user_id', currentUser.id)
      .maybeSingle();

    if (result.error) throw result.error;
    return result.data ? result.data.data : null;
  }

  var saveTimer = null;
  function persist() {
    if (!supabaseClient || !currentUser || !state) return;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(async function () {
      var result = await supabaseClient.from('pacing_data').upsert({
        user_id: currentUser.id,
        data: state,
        updated_at: new Date().toISOString()
      }, { onConflict: 'user_id' });
      if (result.error) console.error('Could not save pacing data:', result.error);
    }, 250);
  }

  function saveImmediately() {
    return new Promise(function (resolve) {
      clearTimeout(saveTimer);
      if (!supabaseClient || !currentUser || !state) return resolve();
      supabaseClient.from('pacing_data').upsert({
        user_id: currentUser.id,
        data: state,
        updated_at: new Date().toISOString()
      }, { onConflict: 'user_id' }).then(function () { resolve(); });
    });
  }

  function uid() {
    return Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
  }

  var PALETTE = ['#5B7B9C', '#B0563E', '#6B7F52', '#7D5A8C', '#4A6670', '#8C5B4A', '#5C6B8C', '#9C6B7D'];

  var currentDate = isoLocal(new Date());

  /* ============ Parsing engine ============ */
  var MONTHS = {
    jan: 0, january: 0, feb: 1, february: 1, mar: 2, march: 2, apr: 3, april: 3,
    may: 4, jun: 5, june: 5, jul: 6, july: 6, aug: 7, august: 7,
    sep: 8, sept: 8, september: 8, oct: 9, october: 9, nov: 10, november: 10, dec: 11, december: 11
  };
  var DAYNAME_RE = /^(mon|tue|tues|wed|weds|thu|thur|thurs|fri|sat|sun)[a-z]*\.?,?\s*[-\u2013\u2014:]?\s*/i;
  var EDGE_PUNCT_RE = /^[\s\-\u2013\u2014:,.]+|[\s\-\u2013\u2014:,.]+$/g;

  function schoolYearAnchor() {
    var today = new Date();
    var m = today.getMonth(); // 0-indexed
    return m >= 6 ? today.getFullYear() : today.getFullYear() - 1;
  }
  function inferYear(month0) {
    var startYear = schoolYearAnchor();
    return month0 >= 6 ? startYear : startYear + 1;
  }

  function extractDate(raw) {
    var s = raw.trim().replace(DAYNAME_RE, '');
    var m, d, rest;

    m = s.match(/\b(\d{4})-(\d{1,2})-(\d{1,2})\b/);
    if (m) {
      d = new Date(+m[1], +m[2] - 1, +m[3]);
      if (!isNaN(d)) {
        rest = (s.slice(0, m.index) + s.slice(m.index + m[0].length)).replace(EDGE_PUNCT_RE, '');
        return { iso: isoLocal(d), rest: rest };
      }
    }

    m = s.match(/\b(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?\b/);
    if (m) {
      var year = m[3] ? (m[3].length === 2 ? 2000 + (+m[3]) : +m[3]) : inferYear(+m[1] - 1);
      d = new Date(year, +m[1] - 1, +m[2]);
      if (!isNaN(d)) {
        rest = (s.slice(0, m.index) + s.slice(m.index + m[0].length)).replace(EDGE_PUNCT_RE, '');
        return { iso: isoLocal(d), rest: rest };
      }
    }

    m = s.match(/\b(jan(?:uary)?|feb(?:ruary)?|mar(?:ch)?|apr(?:il)?|may|jun(?:e)?|jul(?:y)?|aug(?:ust)?|sep(?:t)?(?:ember)?|oct(?:ober)?|nov(?:ember)?|dec(?:ember)?)\.?\s+(\d{1,2})(?:st|nd|rd|th)?(?:,?\s*(\d{4}))?\b/i);
    if (m) {
      var month0 = MONTHS[m[1].toLowerCase()];
      var year2 = m[3] ? +m[3] : inferYear(month0);
      d = new Date(year2, month0, +m[2]);
      if (!isNaN(d)) {
        rest = (s.slice(0, m.index) + s.slice(m.index + m[0].length)).replace(EDGE_PUNCT_RE, '');
        return { iso: isoLocal(d), rest: rest };
      }
    }

    return null;
  }

  function splitColumns(line) {
    if (line.indexOf('\t') !== -1) {
      return line.split('\t').map(function (c) { return c.trim(); });
    }
    if (line.indexOf('|') !== -1) {
      var parts = line.split('|').map(function (c) { return c.trim(); });
      while (parts.length > 1 && parts[0] === '') parts.shift();
      while (parts.length > 1 && parts[parts.length - 1] === '') parts.pop();
      return parts;
    }
    var multi = line.split(/\s{2,}/).map(function (c) { return c.trim(); }).filter(function (c) { return c.length; });
    if (multi.length > 1) return multi;
    return [line.trim()];
  }

  function rowToEntry(cols) {
    if (cols.length === 1) {
      var found1 = extractDate(cols[0]);
      if (found1) return { id: uid(), date: found1.iso, topic: found1.rest, homework: '', note: '' };
      return { id: uid(), date: '', topic: cols[0], homework: '', note: '' };
    }
    var found = extractDate(cols[0]);
    var rest;
    var date = '';
    if (found) {
      date = found.iso;
      rest = found.rest ? [found.rest].concat(cols.slice(1)) : cols.slice(1);
    } else {
      rest = cols.slice(0);
    }
    var topic = rest[0] || '';
    var homework = rest.slice(1).join('; ') || '';
    return { id: uid(), date: date, topic: topic, homework: homework, note: '' };
  }

  function parsePastedGuide(text) {
    var lines = text.split('\n').map(function (l) { return l.trim(); }).filter(function (l) { return l.length > 0; });
    return lines.map(function (line) { return rowToEntry(splitColumns(line)); });
  }

  /* ============ Small helpers ============ */
  function escapeHtml(str) {
    var div = document.createElement('div');
    div.textContent = str == null ? '' : String(str);
    return div.innerHTML;
  }
  function escapeAttr(str) {
    return String(str == null ? '' : str)
      .replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  function nextColor() {
    var used = state.classes.map(function (c) { return c.color; });
    var avail = PALETTE.filter(function (c) { return used.indexOf(c) === -1; });
    return avail.length ? avail[0] : PALETTE[state.classes.length % PALETTE.length];
  }

  /* ============ Agenda rendering ============ */
  var weekdayLabel = document.getElementById('weekdayLabel');
  var dateNumLabel = document.getElementById('dateNumLabel');
  var agendaList = document.getElementById('agendaList');
  var upcomingList = document.getElementById('upcomingList');

  function renderAgenda() {
    weekdayLabel.textContent = formatWeekday(currentDate);
    dateNumLabel.textContent = formatBig(currentDate);
    agendaList.innerHTML = '';

    if (state.classes.length === 0) {
      var empty = document.createElement('div');
      empty.className = 'empty-state';
      empty.innerHTML = 'No classes yet. <button class="link" id="emptyAddClass">Add your first class</button> to start logging pacing guides.';
      agendaList.appendChild(empty);
      var emptyBtn = document.getElementById('emptyAddClass');
      if (emptyBtn) emptyBtn.addEventListener('click', openNewClassModal);
    } else {
      state.classes.forEach(function (cls) {
        var entry = cls.entries.find(function (e) { return e.date === currentDate; });
        var card = document.createElement('button');
        card.type = 'button';
        card.className = 'day-card';
        card.style.setProperty('--class-color', cls.color);

        var noteBadge = entry && entry.note ? '<span class="badge-note">' + escapeHtml(entry.note) + '</span>' : '';
        var body;
        if (entry && (entry.topic || entry.homework)) {
          body = (entry.topic ? '<div class="day-card-topic">' + escapeHtml(entry.topic) + '</div>' : '') +
            '<div class="day-card-hw">' +
            (entry.homework
              ? '<span class="label">Homework</span>' + escapeHtml(entry.homework)
              : '<span class="day-card-empty">No homework logged</span>') +
            '</div>';
        } else {
          body = '<div class="day-card-empty">No pacing guide entry for this date</div>';
        }

        card.innerHTML =
          '<div class="day-card-head">' +
          '<div class="day-card-head-left">' +
          '<span class="day-card-class">' + escapeHtml(cls.name || 'Untitled class') + '</span>' +
          noteBadge +
          '</div>' +
          '<span class="edit-hint">Edit</span>' +
          '</div>' + body;

        card.addEventListener('click', function () { openClassModal(cls.id); });
        agendaList.appendChild(card);
      });
    }

    renderUpcoming();
  }

  function renderUpcoming() {
    upcomingList.innerHTML = '';
    var any = false;
    for (var i = 1; i <= 6; i++) {
      var iso = addDays(currentDate, i);
      var items = [];
      state.classes.forEach(function (cls) {
        var entry = cls.entries.find(function (e) { return e.date === iso; });
        if (entry && (entry.topic || entry.homework || entry.note)) items.push({ cls: cls, entry: entry });
      });
      if (items.length === 0) continue;
      any = true;
      var row = document.createElement('div');
      row.className = 'upcoming-row';
      var itemsHtml = items.map(function (it) {
        return '<div class="upcoming-item">' +
          '<span class="dot" style="background:' + it.cls.color + '"></span>' +
          '<span class="cls">' + escapeHtml(it.cls.name || 'Untitled class') + ':</span>' +
          '<span>' + escapeHtml(it.entry.homework || it.entry.topic || '') + '</span>' +
          (it.entry.note ? '<span class="badge-note">' + escapeHtml(it.entry.note) + '</span>' : '') +
          '</div>';
      }).join('');
      row.innerHTML = '<div class="upcoming-date">' + formatUpcomingDate(iso) + '</div><div class="upcoming-items">' + itemsHtml + '</div>';
      upcomingList.appendChild(row);
    }
    if (!any) {
      upcomingList.innerHTML = '<div class="empty-state bordered">Nothing logged for the next few days yet.</div>';
    }
  }

  /* ============ Date nav + tabs ============ */
  document.getElementById('prevDay').addEventListener('click', function () { currentDate = addDays(currentDate, -1); renderAgenda(); });
  document.getElementById('nextDay').addEventListener('click', function () { currentDate = addDays(currentDate, 1); renderAgenda(); });
  document.getElementById('todayBtn').addEventListener('click', function () { currentDate = isoLocal(new Date()); renderAgenda(); });

  document.querySelectorAll('.tab').forEach(function (tab) {
    tab.addEventListener('click', function () {
      document.querySelectorAll('.tab').forEach(function (t) { t.classList.remove('active'); t.setAttribute('aria-selected', 'false'); });
      tab.classList.add('active'); tab.setAttribute('aria-selected', 'true');
      document.querySelectorAll('.view').forEach(function (v) { v.classList.remove('active'); });
      document.getElementById('view-' + tab.dataset.tab).classList.add('active');
      if (tab.dataset.tab === 'classes') renderClasses();
    });
  });

  /* ============ Classes grid ============ */
  var classGrid = document.getElementById('classGrid');

  function renderClasses() {
    classGrid.innerHTML = '';
    state.classes.forEach(function (cls) {
      var card = document.createElement('button');
      card.type = 'button';
      card.className = 'class-card';
      card.style.setProperty('--class-color', cls.color);
      var withDates = cls.entries.filter(function (e) { return e.date; }).length;
      card.innerHTML =
        '<div class="class-card-name">' + escapeHtml(cls.name || 'Untitled class') + '</div>' +
        '<div class="class-card-meta">' + withDates + (withDates === 1 ? ' entry logged' : ' entries logged') + '</div>';
      card.addEventListener('click', function () { openClassModal(cls.id); });
      classGrid.appendChild(card);
    });
    var addCard = document.createElement('button');
    addCard.type = 'button';
    addCard.className = 'add-class-card';
    addCard.textContent = '+ Add class';
    addCard.addEventListener('click', openNewClassModal);
    classGrid.appendChild(addCard);
  }

  document.getElementById('addClassBtn').addEventListener('click', openNewClassModal);

  /* ============ Class edit modal ============ */
  var modalOverlay = document.getElementById('modalOverlay');
  var modalEl = modalOverlay.querySelector('.modal');
  var editingClassId = null;

  function openNewClassModal() {
    var cls = { id: uid(), name: '', color: nextColor(), entries: [] };
    state.classes.push(cls);
    editingClassId = cls.id;
    persist();
    renderModal();
    modalOverlay.hidden = false;
    requestAnimationFrame(function () {
      var nameInput = modalEl.querySelector('.class-name-input');
      if (nameInput) nameInput.focus();
    });
  }

  function openClassModal(id) {
    editingClassId = id;
    renderModal();
    modalOverlay.hidden = false;
    modalEl.focus();
  }

  function closeModal() {
    var cls = state.classes.find(function (c) { return c.id === editingClassId; });
    if (cls && !cls.name.trim() && cls.entries.length === 0) {
      state.classes = state.classes.filter(function (c) { return c.id !== editingClassId; });
      persist();
    }
    modalOverlay.hidden = true;
    editingClassId = null;
    renderClasses();
    renderAgenda();
  }

  function renderModal() {
    var cls = state.classes.find(function (c) { return c.id === editingClassId; });
    if (!cls) return;

    var colorDots = PALETTE.map(function (c) {
      return '<button type="button" class="dot' + (c === cls.color ? ' selected' : '') + '" data-color="' + c + '" style="background:' + c + '" aria-label="Set class color to ' + c + '"></button>';
    }).join('');

    modalEl.innerHTML =
      '<div class="modal-head">' +
      '<div class="modal-title-row">' +
      '<button type="button" class="color-swatch" id="colorToggle" style="--class-color:' + cls.color + '" aria-label="Change class color"></button>' +
      '<input type="text" class="class-name-input" id="classNameInput" placeholder="Class name" value="' + escapeAttr(cls.name) + '" />' +
      '</div>' +
      '<button type="button" class="close-x" id="closeModalBtn" aria-label="Close">&times;</button>' +
      '</div>' +
      '<div id="colorPicker" class="color-picker" hidden>' + colorDots + '</div>' +

      '<p class="field-label">Paste your pacing guide</p>' +
      '<textarea class="paste-box" id="pasteBox" placeholder="Paste rows from your syllabus or pacing guide — works best copied straight from a spreadsheet or table (tab- or pipe-separated), one entry per line, e.g.:&#10;9/8&#9;Kinematics review&#9;Problems 1-10&#10;9/9&#9;Intro to forces&#9;Read Ch. 4"></textarea>' +
      '<div class="parse-row"><button type="button" class="btn-primary" id="parseBtn">Parse &amp; add rows</button></div>' +

      '<div class="entries-block">' +
      '<div class="entries-head"><h3>Entries (' + cls.entries.length + ')</h3></div>' +
      '<div class="entries-table-wrap">' +
      '<div class="entries-table-head"><span>Date</span><span>Topic</span><span>Homework</span><span>Note</span><span></span></div>' +
      '<div id="entryRows"></div>' +
      '<div class="add-entry-row"><button type="button" id="addEntryBtn">+ Add entry</button></div>' +
      '</div>' +
      '<p class="field-hint">Notes show up as a badge on the agenda — try things like &quot;Flipped,&quot; &quot;Quiz,&quot; or &quot;No school.&quot;</p>' +
      '</div>' +

      '<div class="modal-footer">' +
      '<button type="button" class="btn-danger" id="deleteClassBtn">Delete class</button>' +
      '<button type="button" class="btn-primary" id="doneBtn">Done</button>' +
      '</div>';

    renderEntryRows(cls);
    wireModalEvents(cls);
  }

  function sortedEntries(cls) {
    return cls.entries.slice().sort(function (a, b) { return (a.date || '').localeCompare(b.date || ''); });
  }

  function renderEntryRows(cls, highlightIds) {
    var container = modalEl.querySelector('#entryRows');
    var sorted = sortedEntries(cls);
    container.innerHTML = '';
    sorted.forEach(function (entry) {
      var row = document.createElement('div');
      row.className = 'entry-row' + (highlightIds && highlightIds.has(entry.id) ? ' new-row' : '');
      row.innerHTML =
        '<input type="date" value="' + escapeAttr(entry.date) + '" data-field="date" data-id="' + entry.id + '" aria-label="Date" />' +
        '<input type="text" value="' + escapeAttr(entry.topic) + '" placeholder="Topic" data-field="topic" data-id="' + entry.id + '" aria-label="Topic" />' +
        '<input type="text" value="' + escapeAttr(entry.homework) + '" placeholder="Homework" data-field="homework" data-id="' + entry.id + '" aria-label="Homework" />' +
        '<input type="text" value="' + escapeAttr(entry.note) + '" placeholder="Note" data-field="note" data-id="' + entry.id + '" aria-label="Note" />' +
        '<button type="button" class="row-delete" data-id="' + entry.id + '" aria-label="Delete entry">&times;</button>';
      container.appendChild(row);
    });
  }

  function updateEntriesCount(cls) {
    var h3 = modalEl.querySelector('.entries-head h3');
    if (h3) h3.textContent = 'Entries (' + cls.entries.length + ')';
  }

  function rewireEntryRowEvents(cls) {
    var container = modalEl.querySelector('#entryRows');
    container.querySelectorAll('input').forEach(function (input) {
      input.addEventListener('input', function () {
        var entry = cls.entries.find(function (e) { return e.id === input.dataset.id; });
        if (!entry) return;
        entry[input.dataset.field] = input.value;
        persist();
      });
      if (input.dataset.field === 'date') {
        input.addEventListener('change', function () {
          renderEntryRows(cls);
          rewireEntryRowEvents(cls);
        });
      }
    });
    container.querySelectorAll('.row-delete').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var idx = cls.entries.findIndex(function (e) { return e.id === btn.dataset.id; });
        if (idx === -1) return;
        cls.entries.splice(idx, 1);
        persist();
        updateEntriesCount(cls);
        renderEntryRows(cls);
        rewireEntryRowEvents(cls);
      });
    });
  }

  function wireModalEvents(cls) {
    modalEl.querySelector('#closeModalBtn').addEventListener('click', closeModal);
    modalEl.querySelector('#doneBtn').addEventListener('click', closeModal);

    modalEl.querySelector('#colorToggle').addEventListener('click', function () {
      var picker = modalEl.querySelector('#colorPicker');
      picker.hidden = !picker.hidden;
    });
    modalEl.querySelectorAll('#colorPicker .dot').forEach(function (dot) {
      dot.addEventListener('click', function () {
        cls.color = dot.dataset.color;
        persist();
        renderModal();
      });
    });

    var nameInput = modalEl.querySelector('#classNameInput');
    nameInput.addEventListener('input', function () {
      cls.name = nameInput.value;
      persist();
    });

    modalEl.querySelector('#parseBtn').addEventListener('click', function () {
      var box = modalEl.querySelector('#pasteBox');
      var text = box.value;
      if (!text.trim()) return;
      var newEntries = parsePastedGuide(text);
      if (newEntries.length === 0) return;
      cls.entries.push.apply(cls.entries, newEntries);
      persist();
      box.value = '';
      updateEntriesCount(cls);
      var ids = new Set(newEntries.map(function (e) { return e.id; }));
      renderEntryRows(cls, ids);
      rewireEntryRowEvents(cls);
    });

    modalEl.querySelector('#addEntryBtn').addEventListener('click', function () {
      var entry = { id: uid(), date: currentDate, topic: '', homework: '', note: '' };
      cls.entries.push(entry);
      persist();
      updateEntriesCount(cls);
      renderEntryRows(cls, new Set([entry.id]));
      rewireEntryRowEvents(cls);
    });

    modalEl.querySelector('#deleteClassBtn').addEventListener('click', function () {
      confirmAction('Delete "' + (cls.name || 'this class') + '"? This removes all ' + cls.entries.length + ' logged ' + (cls.entries.length === 1 ? 'entry' : 'entries') + '.', function () {
        state.classes = state.classes.filter(function (c) { return c.id !== cls.id; });
        persist();
        modalOverlay.hidden = true;
        editingClassId = null;
        renderClasses();
        renderAgenda();
      });
    });

    rewireEntryRowEvents(cls);
  }

  modalOverlay.addEventListener('click', function (e) { if (e.target === modalOverlay) closeModal(); });

  /* ============ Confirm dialog ============ */
  var confirmOverlay = document.getElementById('confirmOverlay');
  var confirmEl = confirmOverlay.querySelector('.modal');

  function confirmAction(message, onConfirm) {
    confirmEl.innerHTML =
      '<p class="confirm-text">' + escapeHtml(message) + '</p>' +
      '<div class="confirm-actions">' +
      '<button type="button" class="btn-ghost" id="confirmCancel">Cancel</button>' +
      '<button type="button" class="btn-danger" id="confirmOk">Delete</button>' +
      '</div>';
    confirmOverlay.hidden = false;
    confirmEl.querySelector('#confirmCancel').addEventListener('click', function () { confirmOverlay.hidden = true; });
    confirmEl.querySelector('#confirmOk').addEventListener('click', function () { confirmOverlay.hidden = true; onConfirm(); });
  }
  confirmOverlay.addEventListener('click', function (e) { if (e.target === confirmOverlay) confirmOverlay.hidden = true; });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      if (!confirmOverlay.hidden) confirmOverlay.hidden = true;
      else if (!modalOverlay.hidden) closeModal();
    }
  });

  /* ============ Export / Import ============ */
  document.getElementById('exportBtn').addEventListener('click', function () {
    var blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'pacing-guide-backup-' + isoLocal(new Date()) + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });

  document.getElementById('importBtn').addEventListener('click', function () {
    document.getElementById('importFile').click();
  });
  document.getElementById('importFile').addEventListener('change', function (e) {
    var file = e.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var parsed = JSON.parse(reader.result);
        if (!parsed || !Array.isArray(parsed.classes)) throw new Error('bad format');
        confirmAction('Import this file? It will replace all classes currently in the app.', function () {
          state = parsed;
          persist();
          renderClasses();
          renderAgenda();
        });
      } catch (err) {
        window.alert('Could not read that file — make sure it\'s a backup exported from this app.');
      }
    };
    reader.readAsText(file);
    e.target.value = '';
  });

  /* ============ Authentication ============ */
  var authForm = document.getElementById('authForm');
  var authSubmit = document.getElementById('authSubmit');
  var authToggle = document.getElementById('authToggle');
  var authToggleText = document.getElementById('authToggleText');
  var authEmail = document.getElementById('authEmail');
  var authPassword = document.getElementById('authPassword');
  var logoutBtn = document.getElementById('logoutBtn');

  authToggle.addEventListener('click', function () {
    authMode = authMode === 'login' ? 'signup' : 'login';
    clearAuthMessage();
    authSubmit.textContent = authMode === 'login' ? 'Log in' : 'Create account';
    authToggleText.textContent = authMode === 'login' ? "Don't have an account?" : 'Already have an account?';
    authToggle.textContent = authMode === 'login' ? 'Create account' : 'Log in';
  });

  authForm.addEventListener('submit', async function (e) {
    e.preventDefault();
    clearAuthMessage();
    if (!configured()) {
      showAuthMessage('Supabase is not configured yet. Add your Supabase URL and publishable key in the HTML source.', 'error');
      return;
    }
    authSubmit.disabled = true;
    try {
      var email = authEmail.value.trim();
      var password = authPassword.value;
      var result;
      if (authMode === 'signup') {
        result = await supabaseClient.auth.signUp({ email: email, password: password });
        if (result.error) throw result.error;
        if (result.data.session) {
          await initializeUser(result.data.user);
        } else {
          showAuthMessage('Account created. Check your email to confirm your account, then log in.', 'success');
          authMode = 'login';
          authSubmit.textContent = 'Log in';
          authToggleText.textContent = "Don't have an account?";
          authToggle.textContent = 'Create account';
        }
      } else {
        result = await supabaseClient.auth.signInWithPassword({ email: email, password: password });
        if (result.error) throw result.error;
        await initializeUser(result.data.user);
      }
    } catch (err) {
      showAuthMessage(err.message || 'Authentication failed.', 'error');
    } finally {
      authSubmit.disabled = false;
    }
  });

  logoutBtn.addEventListener('click', async function () {
    await saveImmediately();
    if (supabaseClient) await supabaseClient.auth.signOut();
    showLogin();
  });

  async function initializeUser(user) {
    currentUser = user;
    var loaded = await loadData();
    if (!loaded || !Array.isArray(loaded.classes)) {
      state = seedData();
      await saveImmediately();
    } else {
      state = loaded;
    }
    showApp(user);
    renderAgenda();
    renderClasses();
  }

  async function initAuth() {
    if (!configured()) {
      document.querySelector('.app').classList.add('hidden');
      document.getElementById('authScreen').classList.remove('hidden');
      showAuthMessage('Setup needed: add your Supabase Project URL and Publishable/anon key in this HTML file.', 'error');
      return;
    }

    supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
    supabaseClient.auth.onAuthStateChange(function (event, session) {
      if (event === 'SIGNED_OUT') showLogin();
    });

    var result = await supabaseClient.auth.getSession();
    if (result.error) {
      showAuthMessage(result.error.message, 'error');
      return;
    }
    if (result.data.session && result.data.session.user) {
      try {
        await initializeUser(result.data.session.user);
      } catch (err) {
        showAuthMessage(err.message || 'Could not load your data.', 'error');
      }
    } else {
      showLogin();
    }
  }

  /* ============ Init ============ */
  window.addEventListener('beforeunload', function () {
    saveImmediately();
  });
  initAuth();
})();
</script>
</body>
</html>
